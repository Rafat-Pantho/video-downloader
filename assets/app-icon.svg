<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Dark elegant theme) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E" />
      <stop offset="50%" stop-color="#16213E" />
      <stop offset="100%" stop-color="#0F3460" />
    </linearGradient>

    <!-- Accent Gradient (Neon Pink/Cyan) -->
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E94560" />
      <stop offset="100%" stop-color="#00D2FC" />
    </linearGradient>

    <!-- Inner Glow -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for the main circle -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle (macOS/iOS style) -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGradient)" filter="url(#shadow)" />

  <!-- Thin inner border for reflection effect -->
  <rect x="34" y="34" width="444" height="444" rx="98" ry="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />

  <!-- Abstract intersecting shapes representing video (play) and download (arrow) -->
  <g transform="translate(256, 266)">
    <!-- The Video Play Triangle (Highlighted and bold) -->
    <!-- Inner solid triangle with gradient -->
    <path d="M -60 -80 L 80 -10 L -60 60 Z" fill="url(#accentGradient)" fill-opacity="0.8" filter="url(#neonGlow)" />
    
    <!-- Outer thick glowing border for the triangle -->
    <path d="M -70 -100 L 90 -20 L -70 80 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="8" stroke-linejoin="round" filter="url(#neonGlow)" />
    
    <!-- Bold Download Arrow overlaid -->
    <path d="M 0 -110 L 0 50" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" filter="url(#shadow)" />
    <path d="M -50 0 L 0 50 L 50 0" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
    
    <!-- Neon Accent Dots / Accents -->
    <circle cx="0" cy="-140" r="12" fill="#00D2FC" filter="url(#neonGlow)" />
    
    <!-- Bottom Tray -->
    <path d="M -80 110 L 80 110" stroke="url(#accentGradient)" stroke-width="16" stroke-linecap="round" filter="url(#neonGlow)" />
  </g>
</svg>