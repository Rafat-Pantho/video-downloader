<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <!-- Apply the saved theme before first paint so there's no light/dark flash. -->
  <script>
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100vh;
    }

    /* Loading state shown until the React bundle mounts */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 45%, #eff6ff 100%);
      color: #4f46e5;
      font-size: 24px;
      font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root[data-theme="dark"] #loading {
      background: linear-gradient(160deg, #0b1120 0%, #0f172a 45%, #0b1224 100%);
      color: #818cf8;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">Loading Video Downloader...</div>
  </div>
  <!-- html-webpack-plugin injects the bundled <script> here -->
</body>
</html>
